<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выбор инструмента</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="topbar">
    <div class="wrap">
        <div class="topbar-row">
            <div class="topbar-left">
                <a href="{{ url_for('main.option_menu') }}" class="btn-pill">Произвести расчет</a>
                <a href="{{ url_for('main.volatility') }}" class="btn-pill">Предсказать волатильность</a>
                <a href="{{ url_for('main.reports') }}" class="btn-pill">Архив отчетов</a>
            </div>

            <div class="topbar-center">
                <div>Здравствуйте, {{ session.get('login', 'Пользователь') }}!</div>
                <div style="font-size:12px; color:#666; margin-top:4px;">
                    {% if session.get('role') == 'admin' %}
                        Администратор
                    {% else %}
                        Аналитик
                    {% endif %}
                </div>
            </div>

            <div class="topbar-right">
                <a href="{{ url_for('auth.logout') }}" class="btn-pill red">Выйти</a>
            </div>
        </div>
    </div>
</div>

<div class="wrap">
    <div class="search-wrap">
        <form method="get" class="search">
            <input type="text" name="q" value="{{ query }}" placeholder="Введите тикер опциона">
            <button type="submit" style="border:none; background:none; font-size:28px; cursor:pointer;">⌕</button>
        </form>
    </div>

    <div class="list">
        {% for item in items %}
            <div class="item">
                <div class="item-left">
                    <div class="badge">◉</div>
                    <div class="item-name">{{ item.name }}</div>
                </div>

                <a href="{{ url_for('main.option', ticker=item.ticker) }}" class="btn-big" style="width:300px; margin:0;">
                    Рассчитать
                </a>
            </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
